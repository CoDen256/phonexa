<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Token Drill — IPA Vowel Chart</title>
  <link rel="stylesheet" href="css/index.css">
  <style>
    .drill-wrap { width:100%; max-width:1000px; margin:0 auto; }
    .drill-toolbar { display:flex; align-items:center; gap:8px; margin-bottom:14px; flex-wrap:wrap; }
    .drill-toolbar select, .drill-toolbar input {
      background:#1a2e48; border:1px solid #2e4560; border-radius:6px; color:#d8e8f4;
      padding:6px 9px; font-size:.78rem;
    }
    .drill-toolbar input { flex:1; min-width:160px; }
    #drillCount { font-size:.75rem; color:var(--muted); white-space:nowrap; }
    .drill-trim-toggle { display:flex; align-items:center; gap:5px; font-size:.72rem; color:var(--muted); white-space:nowrap; }

    .drill-row {
      display:flex; align-items:center; gap:8px; padding:9px 10px; margin-bottom:6px;
      background:var(--surface); border:1px solid var(--border); border-radius:9px;
    }
    .drill-main { flex:1; min-width:0; }
    .drill-symbol { font-family:Georgia,'Noto Serif',serif; font-size:1.1rem; color:#7eb8f7; margin-right:8px; }
    .drill-text { font-family:Georgia,'Noto Serif',serif; font-size:.85rem; color:#c8d8e8; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .drill-text mark { background:#7eb8f733; color:#7eb8f7; border-radius:2px; padding:0 1px; }
    .drill-controls { display:flex; align-items:center; gap:5px; flex-wrap:wrap; }
    .drill-btn {
      display:inline-flex; align-items:center; gap:3px; padding:5px 10px; border-radius:7px; border:1px solid #2e4560;
      background:#1a2e48; color:#d8e8f4; font-size:.72rem; cursor:pointer; white-space:nowrap;
    }
    .drill-btn:hover:not(:disabled) { background:#243c5a; border-color:#4a7098; }
    .drill-btn:disabled { opacity:.4; cursor:default; }
    .drill-btn.recording { background:#5a2020; border-color:#a04040; color:#ffb8b8; }
    .drill-status { font-size:.68rem; color:var(--muted); min-width:72px; }
    #drillEmpty { padding:40px 20px; text-align:center; color:var(--muted); font-size:.85rem; }
  </style>
</head>
<body>

<header>
  <h1>Token Drill</h1>
  <p>Play a reference token, record yourself, compare</p>
  <a href="index.html"  class="editor-link">← Vowel Chart</a>
  <a href="editor.html" class="editor-link">✎ Edit languages</a>
  <a href="sounds.html" class="editor-link">♪ Sound Library</a>
  <a href="tokens.html" class="editor-link">⠿ Token Browser</a>
</header>

<div class="drill-wrap">
  <div class="drill-toolbar">
    <select id="langSelect"><option value="">Loading languages…</option></select>
    <select id="vowelSelect"><option value="">All vowels</option></select>
    <input type="text" id="filterInput" placeholder="Filter by symbol or sample text…">
    <label class="drill-trim-toggle"><input type="checkbox" id="trimSilenceToggle" checked> ✂ trim leading silence</label>
    <span id="drillCount"></span>
  </div>
  <div id="drillList"></div>
  <div id="drillEmpty" style="display:none">No tokens for this filter.</div>
</div>

<script src="js/audio.js"></script>
<script src="js/vad.js"></script>
<script src="js/drill.js"></script>
</body>
</html>
